[project]
name = "plagas"
version = "0.1.0"
description = "API de diagnóstico de plagas y enfermedades en palta Hass"
requires-python = ">=3.12,<3.13"
readme = "README.md"
authors = [
  { name = "Equipo App Plagas Palta Hass" }
]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "structlog>=24.4",
  "ultralytics>=8.3",
  "pillow>=11",
  "anyio>=4.6",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.28",
  "slowapi>=0.1.9",
  "tenacity>=9.0",
  "aiosqlite>=0.22.1",
]

# torch y torchvision se instalan desde el índice CPU (ver [tool.uv.sources])
[project.optional-dependencies]
torch-cpu = [
  "torch>=2.5",
  "torchvision>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plagas"]

# =====================================================
# uv: índice CPU para torch
# =====================================================
[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "httpx>=0.28",
  "testcontainers[postgres]>=4.8",
  "mypy>=1.13",
  "ruff>=0.8",
  "import-linter>=2.1",
  "pip-audit>=2.7",
  "types-PyYAML>=6.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# =====================================================
# pytest
# =====================================================
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: requiere Docker (Postgres con testcontainers)",
  "modelo: requiere los pesos reales en models/",
]
addopts = [
  "-m", "not integration and not modelo",
  "--strict-markers",
  "--strict-config",
  "--cov=plagas",
  "--cov-branch",
  "--cov-report=term-missing",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:pkg_resources",
]

# =====================================================
# coverage
# =====================================================
[tool.coverage.run]
source = ["plagas"]
branch = true
omit = [
  "*/tests/*",
  "*/migrations/*",
  "*/__init__.py",
]

[tool.coverage.report]
fail_under = 80
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
  "pragma: no cover",
  "@abstractmethod",
]
show_missing = true
skip_covered = false

# =====================================================
# ruff
# =====================================================
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions", "ml/", ".venv/"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "S",   # flake8-bandit (seguridad)
  "ASYNC",  # flake8-async
  "PT",  # flake8-pytest-style
  "SIM", # flake8-simplify
  "RUF", # ruff-specific
  "N",   # pep8-naming
  "C4",  # flake8-comprehensions
  "DTZ", # flake8-datetimez
  "PIE", # flake8-pie
  "RET", # flake8-return
  "TID", # flake8-tidy-imports
]
ignore = [
  "E501",   # line length (ruff format lo maneja)
  "B008",   # function call in default argument (Depends, Field son OK)
  "S101",   # assert (permitido en tests)
  "N818",   # Error suffix on exception names (nombres en español tipo ErrorDominio)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]   # assert, passwords hardcoded en tests
"alembic/**" = ["E", "F"]
"ml/**" = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["plagas"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# =====================================================
# mypy — strict
# =====================================================
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
plugins = []
exclude = [
  "^backend/alembic/versions/",
  "^ml/",
  "^tests/fixtures/",
]

[[tool.mypy.overrides]]
module = "ultralytics.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "testcontainers.*"
ignore_missing_imports = true

# =====================================================
# import-linter — enforce hexagonal
# =====================================================
[tool.importlinter]
root_package = "plagas"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Capas hexagonales"
type = "layers"
containers = [
  "plagas.modules.diagnostico",
  "plagas.modules.catalogo",
]
layers = [
  "api",
  "infrastructure",
  "application",
  "domain",
]

[[tool.importlinter.contracts]]
name = "La API no conoce la infraestructura"
type = "forbidden"
source_modules = ["plagas.modules.*.api"]
forbidden_modules = [
  "plagas.modules.*.infrastructure",
  "plagas.shared.infrastructure",
]

[[tool.importlinter.contracts]]
name = "Dominio puro"
type = "forbidden"
source_modules = [
  "plagas.modules.*.domain",
  "plagas.shared.domain",
]
forbidden_modules = [
  "fastapi",
  "sqlalchemy",
  "ultralytics",
  "pydantic",
]

[[tool.importlinter.contracts]]
name = "Módulos independientes"
type = "independence"
modules = [
  "plagas.modules.diagnostico",
  "plagas.modules.catalogo",
]
