augmentations:
- __version__: 2.0.8
  transform:
    __class_fullname__: OneOf
    p: 0.25
    transforms:
    - __class_fullname__: MotionBlur
      p: 0.5
      allow_shifted: true
      angle_range:
      - 0.0
      - 360.0
      blur_limit:
      - 3
      - 11
      direction_range:
      - -1.0
      - 1.0
    - __class_fullname__: GaussianBlur
      p: 0.5
      blur_limit:
      - 3
      - 9
      sigma_limit:
      - 0.5
      - 3.0
    - __class_fullname__: Defocus
      p: 0.5
      alias_blur:
      - 0.1
      - 0.5
      radius:
      - 1
      - 4
- __version__: 2.0.8
  transform:
    __class_fullname__: Downscale
    p: 0.15
    interpolation_pair:
      upscale: 0
      downscale: 0
    scale_range:
    - 0.35
    - 0.9
- __version__: 2.0.8
  transform:
    __class_fullname__: OneOf
    p: 0.15
    transforms:
    - __class_fullname__: GaussNoise
      p: 0.5
      mean_range:
      - 0.0
      - 0.0
      noise_scale_factor: 1.0
      per_channel: true
      std_range:
      - 0.02
      - 0.07
    - __class_fullname__: ISONoise
      p: 0.5
      color_shift:
      - 0.01
      - 0.05
      intensity:
      - 0.1
      - 0.5
- __version__: 2.0.8
  transform:
    __class_fullname__: ImageCompression
    p: 0.2
    compression_type: jpeg
    quality_range:
    - 40
    - 95
- __version__: 2.0.8
  transform:
    __class_fullname__: RandomBrightnessContrast
    p: 0.3
    brightness_by_max: true
    brightness_limit:
    - -0.25
    - 0.25
    contrast_limit:
    - -0.25
    - 0.25
    ensure_safe_range: false
- __version__: 2.0.8
  transform:
    __class_fullname__: RandomGamma
    p: 0.15
    gamma_limit:
    - 70.0
    - 140.0
- __version__: 2.0.8
  transform:
    __class_fullname__: CLAHE
    p: 0.05
    clip_limit:
    - 1.0
    - 4.0
    tile_grid_size:
    - 8
    - 8
- __version__: 2.0.8
  transform:
    __class_fullname__: ToGray
    p: 0.01
    method: weighted_average
    num_output_channels: 3
